<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Vice — AI Center Village</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--night); }

    #stage { position: fixed; inset: 0; }
    #map {
      position: absolute;
      transition: transform 1s ease-in-out;
      will-change: transform;
    }
    #map img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      display: block;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }
    .hotspot:hover, .hotspot:focus-visible {
      outline: 2px dashed var(--aqua);
      outline-offset: 2px;
    }
    .hotspot .tag {
      position: absolute; left: 50%; bottom: -6px;
      transform: translate(-50%, 100%);
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--accent, var(--aqua));
      text-shadow: 0 0 8px var(--accent, var(--aqua));
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .hotspot:hover .tag, .hotspot:focus-visible .tag { opacity: 1; }
    .hotspot.done::after {
      content: '★';
      position: absolute; top: -14px; right: -10px;
      color: var(--sun);
      text-shadow: 0 0 10px var(--sun);
      font-size: 20px;
    }

    #sprite {
      position: absolute;
      display: none;
      image-rendering: pixelated;
      transition: opacity .35s;
      z-index: 5;
    }
    #doorglow {
      position: absolute;
      display: none;
      border-radius: 4px;
      box-shadow: 0 0 24px 10px var(--aqua), inset 0 0 18px var(--aqua);
      z-index: 4;
    }

    #hud {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 18px; align-items: center;
      background: rgba(10, 5, 24, 0.85);
      border: 2px solid var(--sun);
      border-radius: 4px;
      padding: 8px 18px;
      z-index: 20;
    }
    #hud .who { display: flex; align-items: center; gap: 8px; color: var(--aqua); }
    #hud-sprite { image-rendering: pixelated; }
    .mute-btn {
      background: none; border: none; color: var(--aqua);
      font: inherit; cursor: pointer; padding: 0 4px; font-size: 14px;
    }
    .mute-btn.off { color: #5a5080; }

    #player-modal {
      position: fixed; inset: 0; display: none;
      background: rgba(10, 5, 24, 0.92);
      z-index: 40;
      align-items: center; justify-content: center;
    }
    #player-modal.open { display: flex; }
    #player-modal .card { max-width: 440px; text-align: center; padding: 32px; }
    #player-modal input {
      display: block; width: 100%; margin: 12px 0;
      font-family: 'VT323', monospace; font-size: 26px; text-align: center;
      background: var(--night); color: var(--aqua);
      border: 2px solid var(--aqua); border-radius: 4px; padding: 8px;
    }
    #player-modal input::placeholder { color: #5a5080; }
    #player-modal .hint { color: #8a7fb0; font-size: 18px; margin: 0 0 12px; }

    #overlay {
      position: fixed; inset: 0;
      display: none;
      z-index: 30;
      background: var(--night) url('assets/ai-center-room.png') center/cover no-repeat;
      image-rendering: pixelated;
      overflow: auto;
    }
    #overlay.open { display: block; }
    #overlay .panel {
      max-width: 860px;
      margin: 80px auto 60px;
    }
    .char { display: flex; align-items: center; gap: 12px; margin: 10px 0; text-align: left; }
    .swatch { width: 34px; height: 34px; border-radius: 50%; flex: none; }
    .board { margin-top: 24px; }
    .board td { padding: 4px 14px; font-size: 22px; }
    #back-to-map { position: fixed; top: 14px; left: 14px; z-index: 31; }

    #fade {
      position: fixed; inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s;
      z-index: 50;
    }
    #fade.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="hud" class="pixel">
    <span style="color:var(--pink)">AI VICE</span>
    <span class="who"><canvas id="hud-sprite" width="24" height="20"></canvas><b id="hud-name"></b></span>
    <span>TOKENS <b id="hud-tokens" style="color:var(--sun)">0</b></span>
    <span>DONE <b id="hud-done" style="color:var(--aqua)">0/4</b></span>
    <button id="mute" class="mute-btn" aria-label="Toggle sound">&#9834;</button>
  </div>

  <div id="stage">
    <div id="map">
      <img src="assets/map.png" alt="Neon map of Miami: Wynwood, Brickell, downtown, South Beach, Key Biscayne">
      <canvas id="sprite" width="48" height="40"></canvas>
      <div id="doorglow"></div>
    </div>
  </div>

  <div id="overlay">
    <button id="back-to-map" class="btn ghost">&larr; BACK TO MAP</button>
    <div class="panel">
      <div class="card" style="--accent:var(--pink);text-align:center">
        <h2 class="neon" style="margin-top:0">THE AI CENTER</h2>
        <p class="pixel" style="color:var(--sun)">TOKENS: <span id="shop-tokens">0</span></p>
        <div id="chars"></div>
      </div>
      <div class="card board" style="--accent:var(--aqua)">
        <h3 class="neon" style="--accent:var(--aqua);margin-top:0">LEADERBOARD</h3>
        <table id="board" style="margin:0 auto"></table>
      </div>
    </div>
  </div>

  <div id="player-modal">
    <div class="card" style="--accent:var(--pink)">
      <h2 class="neon" style="margin-top:0">WELCOME TO OCEAN DRIVE</h2>
      <p>What's your name, hotshot?</p>
      <input id="pname" maxlength="24" placeholder="NICKNAME" autocomplete="off">
      <input id="pcrew" maxlength="24" placeholder="CREW CODE (OPTIONAL)" autocomplete="off">
      <p class="hint">Friends who enter the same code share a board.</p>
      <button class="btn" id="pgo">HIT THE STRIP</button>
    </div>
  </div>

  <div id="fade"></div>

  <script src="shared/config.js"></script>
  <script src="shared/wallet.js"></script>
  <script src="shared/sprite.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="shared/leaderboard.js"></script>
  <script>
    var MAP_W = 960, MAP_H = 540;
    var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // % of map image: x,y = top-left of the building, w,h = its size. Tune freely.
    var HOTSPOTS = {
      'ai-center':    { label: 'AI Center',       x: 44, y: 33, w: 16, h: 18, accent: 'var(--pink)'   },
      'python-lab':   { label: 'Programming Lab', x: 24, y: 11, w: 12, h: 14, accent: 'var(--aqua)'   },
      'robotics':     { label: 'Robotics',        x: 32, y: 53, w: 12, h: 14, accent: 'var(--sunset)' },
      'matrix-motel': { label: 'Matrix Motel',    x: 76, y: 24, w: 12, h: 16, accent: 'var(--pink)'   },
      'dx-lab':       { label: 'DX Lab',          x: 71, y: 74, w: 14, h: 12, accent: 'var(--sun)'    }
    };

    var map = document.getElementById('map');
    var sprite = document.getElementById('sprite');
    var sctx = sprite.getContext('2d');
    var glow = document.getElementById('doorglow');
    var fadeEl = document.getElementById('fade');
    var overlay = document.getElementById('overlay');
    var busy = false;

    function fit() {
      var s = Math.max(innerWidth / MAP_W, innerHeight / MAP_H);
      map.style.width = MAP_W * s + 'px';
      map.style.height = MAP_H * s + 'px';
      map.style.left = (innerWidth - MAP_W * s) / 2 + 'px';
      map.style.top = (innerHeight - MAP_H * s) / 2 + 'px';
    }
    addEventListener('resize', fit);
    fit();

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function refreshHud() {
      document.getElementById('hud-tokens').textContent = AIVice.getTokens();
      document.getElementById('hud-done').textContent = AIVice.getCompleted().length + '/4';
      document.getElementById('hud-name').textContent = AIVice.getPlayer().name || 'ANON';
      var hc = document.getElementById('hud-sprite').getContext('2d');
      hc.clearRect(0, 0, 24, 20);
      AIViceSprite.draw(hc, AIVice.getActiveCharacter().colors, 0, 0, 0, 2);
      document.querySelectorAll('.hotspot').forEach(function (el) {
        el.classList.toggle('done', AIVice.isComplete(el.dataset.id));
      });
      updateMuteBtn();
    }

    var muteBtn = document.getElementById('mute');
    function updateMuteBtn() {
      var m = AIVice.isMuted();
      muteBtn.classList.toggle('off', m);
      muteBtn.innerHTML = m ? '&#9835;&#x0338;' : '&#9834;';
      muteBtn.setAttribute('aria-pressed', m ? 'true' : 'false');
    }
    muteBtn.addEventListener('click', function () {
      if (AIVice.music && AIVice.music.toggle) AIVice.music.toggle();
      else AIVice.setMuted(!AIVice.isMuted());
      updateMuteBtn();
    });

    var playerModal = document.getElementById('player-modal');
    if (!AIVice.getPlayer().name) {
      playerModal.classList.add('open');
      setTimeout(function () { document.getElementById('pname').focus(); }, 50);
    }
    function submitPlayer() {
      var name = document.getElementById('pname').value.trim();
      if (!name) { document.getElementById('pname').focus(); return; }
      AIVice.setPlayer(name, document.getElementById('pcrew').value.trim());
      playerModal.classList.remove('open');
      refreshHud();
    }
    document.getElementById('pgo').addEventListener('click', submitPlayer);
    playerModal.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitPlayer();
    });

    Object.keys(HOTSPOTS).forEach(function (id) {
      var h = HOTSPOTS[id];
      var el = document.createElement('button');
      el.className = 'hotspot';
      el.dataset.id = id;
      el.style.cssText = 'left:' + h.x + '%;top:' + h.y + '%;width:' + h.w + '%;height:' + h.h + '%;--accent:' + h.accent;
      el.setAttribute('aria-label', h.label);
      el.innerHTML = '<span class="tag">' + h.label.toUpperCase() + '</span>';
      el.addEventListener('click', function () { enter(id, h); });
      map.appendChild(el);
    });

    function zoomOn(h) {
      map.style.transformOrigin = (h.x + h.w / 2) + '% ' + (h.y + h.h / 2) + '%';
      map.style.transform = 'scale(2.5)';
    }

    function drawFrame(colors, frame) {
      sctx.clearRect(0, 0, sprite.width, sprite.height);
      AIViceSprite.draw(sctx, colors, frame, 0, 0, 4);
    }

    function walkToDoor(h) {
      return new Promise(function (resolve) {
        var colors = AIVice.getActiveCharacter().colors;
        var doorX = (h.x + h.w / 2) / 100;
        var doorY = (h.y + h.h) / 100;
        var startX = doorX - 0.05, startY = doorY + 0.10;
        var sw = sprite.width / MAP_W, sh = sprite.height / MAP_H;
        var t0 = performance.now(), D = 1500;
        sprite.style.display = 'block';
        (function step(now) {
          var p = Math.min(1, (now - t0) / D);
          var x = startX + (doorX - startX) * p - sw / 2;
          var y = startY + (doorY - startY) * p - sh;
          sprite.style.left = x * 100 + '%';
          sprite.style.top = y * 100 + '%';
          drawFrame(colors, Math.floor(now / 180) % 2);
          if (p < 1) requestAnimationFrame(step); else resolve();
        })(t0);
      });
    }

    function enterDoor(h) {
      glow.style.cssText = 'display:block;left:' + (h.x + h.w * 0.25) + '%;top:' + (h.y + h.h * 0.6) +
        '%;width:' + h.w * 0.5 + '%;height:' + h.h * 0.4 + '%;';
      sprite.style.opacity = '0';
      return wait(400);
    }

    function resetActors() {
      sprite.style.display = 'none';
      sprite.style.opacity = '1';
      glow.style.display = 'none';
    }

    async function enter(id, h) {
      if (busy) return;
      busy = true;
      if (REDUCED) {
        fadeEl.classList.add('on');
        await wait(400);
        if (id === 'ai-center') openAiCenter(); else location.href = 'games/' + id + '/index.html';
        busy = false;
        return;
      }
      zoomOn(h);
      await wait(1050);
      if (id === 'ai-center') { openAiCenter(); busy = false; return; }
      await walkToDoor(h);
      await enterDoor(h);
      fadeEl.classList.add('on');
      await wait(420);
      location.href = 'games/' + id + '/index.html';
    }

    function openAiCenter() {
      renderShop();
      renderBoard();
      overlay.classList.add('open');
    }

    document.getElementById('back-to-map').addEventListener('click', function () {
      overlay.classList.remove('open');
      map.style.transform = 'scale(1)';
      resetActors();
      busy = false;
      refreshHud();
    });

    function renderShop() {
      document.getElementById('shop-tokens').textContent = AIVice.getTokens();
      var wrap = document.getElementById('chars');
      wrap.innerHTML = '';
      AIVice.getCharacters().forEach(function (c) {
        var row = document.createElement('div');
        row.className = 'char';
        row.innerHTML =
          '<span class="swatch" style="background:' + c.colors.accent + ';box-shadow:0 0 10px ' + c.colors.accent + '"></span>' +
          '<span style="flex:1"><b>' + c.name + '</b><br><span class="pixel">' +
          (c.owned ? 'OWNED' : c.price + ' TOKENS') + '</span></span>';
        var btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = c.active ? 'EQUIPPED' : c.owned ? 'EQUIP' : 'BUY';
        btn.disabled = c.active;
        btn.onclick = function () {
          if (c.owned) AIVice.equip(c.id); else AIVice.buy(c.id);
          renderShop();
          refreshHud();
        };
        row.appendChild(btn);
        wrap.appendChild(row);
      });
    }

    function renderBoard() {
      var names = { 'python-lab': 'Programming Lab', 'robotics': 'Robotics', 'dx-lab': 'DX Lab', 'matrix-motel': 'Matrix Motel' };
      var rows = Object.keys(names).map(function (id) {
        var done = AIVice.isComplete(id);
        return '<tr><td style="color:' + (done ? 'var(--aqua)' : '#8a7fb0') + '">' + names[id] +
          '</td><td class="pixel" style="color:' + (done ? 'var(--sun)' : '#5a5080') + '">' +
          (done ? 'CLEARED +50' : '—') + '</td></tr>';
      });
      rows.push('<tr><td style="border-top:1px solid #444;color:var(--sun)">TOTAL TOKENS</td>' +
        '<td class="pixel" style="border-top:1px solid #444;color:var(--sun)">' + AIVice.getTokens() + '</td></tr>');
      document.getElementById('board').innerHTML = rows.join('');
    }

    refreshHud();
  </script>
</body>
</html>
